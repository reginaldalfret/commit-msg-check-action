name: "Commit Msg Check"
description: "Checks commit messages using a Python script"

inputs:
  base:
    description: "Base SHA for the commit range"
    required: true

  head:
    description: "Head SHA for the commit range"
    required: true

  body-char-limit:
    required: false
    default: "72"
    description: "Word wrap limit for each line in the body"

  sub-char-limit:
    required: false
    default: "72"
    description: "Character limit for subject"

  check-blank-line:
    required: false
    default: "true"
    description: "check for a blank line between commit title and body"
  
  strict-line-length-check:
    required: false
    default: "true"
    description: "When false, allows exceeding the character limit if the last word is a single token"

  allow-empty-body:
    required: false
    default: "false"
    description: "When true, allows commit messages with subject (and trailers) only, omitting a body"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Cache Python dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('${{ github.action_path }}/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      shell: bash
      run: pip install -r "$GITHUB_ACTION_PATH/requirements.txt"

    - name: Check commit messages
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_BASE: ${{ inputs.base }}
        ACTION_HEAD: ${{ inputs.head }}
        ACTION_BODY_LIMIT: ${{ inputs.body-char-limit }}
        ACTION_SUB_LIMIT: ${{ inputs.sub-char-limit }}
        ACTION_CHECK_BLANK_LINE: ${{ inputs.check-blank-line }}
        ACTION_STRICT_LINE_LENGTH: ${{ inputs.strict-line-length-check }}
        ACTION_ALLOW_EMPTY_BODY: ${{ inputs.allow-empty-body }}
      run: |
        python "$GITHUB_ACTION_PATH/check_commits.py" \
          --base "$ACTION_BASE" \
          --head "$ACTION_HEAD" \
          --body-limit "$ACTION_BODY_LIMIT" \
          --sub-limit "$ACTION_SUB_LIMIT" \
          --check-blank-line "$ACTION_CHECK_BLANK_LINE" \
          --strict-line-length-check "$ACTION_STRICT_LINE_LENGTH" \
          --allow-empty-body "$ACTION_ALLOW_EMPTY_BODY"
